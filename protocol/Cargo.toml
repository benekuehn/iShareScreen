[package]
name = "isharescreen-protocol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native Apple Screen Sharing transport and packet assembly"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
ctr = "0.9.2"
hmac = "0.12.1"
sha1 = "0.10.6"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
openssl = "0.10.81"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
